<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Printwarden tests</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; margin: 24px; background: #fff; color: #222; }
    h1 { font-size: 18px; }
    .pass { color: #2a7a3a; }
    .fail { color: #b3261e; font-weight: 600; }
    pre { font-weight: 400; background: #fbeceb; padding: 6px 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="out">Running…</div>
  <script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/three-addons/" } }</script>
  <script type="module">
    import { run } from "./harness.js";
    import "./core.test.js";
    import "./v2.test.js";
    import "./pdf.test.js";
    import "./geometry.test.js";
    import "./motion.test.js";
    import "./scene.test.js";
    import "./turning.test.js";
    import "./sharpness.test.js";
    import "./checklist.test.js";
    import "./bundle.test.js";
    import "./export.test.js";
    import "./panel.test.js";
    import "./fixtures.test.js";
    import "./fold.test.js";
    // ?only=words: just the tests whose names hold them (the whole suite takes minutes).
    const only = new URLSearchParams(location.search).get("only");
    run(document.getElementById("out"), only ? (name) => name.includes(only) : null);
  </script>
</body>
</html>
