# Builds the desktop app for Windows and macOS on GitHub's machines, so a Mac build
# doesn't need a Mac. Run it from the repository's Actions tab ("Run workflow"); the
# portable zips appear as downloadable artifacts on the run's page. Given a release's tag
# (a draft made beforehand, say), each build also attaches its zip to that release, so
# nothing has to be downloaded and uploaded again by hand.
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the zips to this release (its tag, e.g. v1.0.0); empty: artifacts only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: _build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: node build.mjs ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.target }}
          path: _build/dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: ${{ inputs.release != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" dist/*.zip --clobber --repo "${{ github.repository }}"
